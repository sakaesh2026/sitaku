<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="あさのしたく">
<meta name="theme-color" content="#77c4ff">
<title>あさのしたく ミッション</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Klee+One:wght@600&family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one-screen iPad app — top progress track, centre card stage, bottom action bar; themed scenery sits behind, effects float above */
:root{
  --ink:#1f2d45; --ink-2:#5a6a84; --paper:#ffffff; --paper-2:#f2f5fa; --line:#dce4ef;
  --go:#22a556; --go-2:#167a3e; --accent:#2f7de1; --accent-2:#1b5bb0; --alert:#e5483f; --gold:#f5b50e;
  --app-bg:#cfeaff;
  --sheet-bg:#edf1f7; --sheet-card:#ffffff; --sheet-ink:#1c2738; --sheet-soft:#617089; --sheet-line:#d6deea; --sheet-accent:#2f7de1; --sheet-field:#f6f8fc; --sheet-chip:#e8eef7;
  --font-ui:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans','Meiryo',system-ui,sans-serif;
  --font-pop:'Mochiy Pop One','Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans',sans-serif;
  --font-dot:'DotGothic16','Osaka-Mono','MS Gothic',monospace;
  --font-kyo:'Klee One','UD デジタル 教科書体 NK-R','UD Digi Kyokasho NK-R','Hiragino Maru Gothic ProN',sans-serif;
  --font-task:var(--font-ui);
  --ground:0px; --track-h:clamp(64px,12vh,118px);
  --card-bg:#ffffff; --card-ink:#1f2d45;
  --done:#22a556; --done-2:#167a3e;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--sheet-bg:#111723;--sheet-card:#1a2232;--sheet-ink:#e7ecf5;--sheet-soft:#9babc2;--sheet-line:#2b374d;--sheet-accent:#6ea9ff;--sheet-field:#131b29;--sheet-chip:#243047;color-scheme:dark}
}
:root[data-theme="dark"]{--sheet-bg:#111723;--sheet-card:#1a2232;--sheet-ink:#e7ecf5;--sheet-soft:#9babc2;--sheet-line:#2b374d;--sheet-accent:#6ea9ff;--sheet-field:#131b29;--sheet-chip:#243047;color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--app-bg);color:var(--ink);font-family:var(--font-ui);font-weight:700;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none;touch-action:manipulation}
body.font-kyo{--font-task:var(--font-kyo)}
button{font-family:inherit;color:inherit}
svg{display:block}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1;font-weight:400}

#bg,#stage-back,#stage-front,#fx,#overlay{position:fixed;inset:0;pointer-events:none}
#bg{z-index:0;overflow:hidden}
#stage-back{z-index:1;overflow:hidden}
#app{position:fixed;inset:0;z-index:2}
#overlay{z-index:4}
#overlay>*{pointer-events:auto}
#stage-front{z-index:5;overflow:hidden}
#fx{z-index:6}
#sheet-root{position:fixed;inset:0;z-index:20;pointer-events:none}
#sheet-root>*{pointer-events:auto}
#modal{position:fixed;inset:0;z-index:25;pointer-events:none}
#modal>*{pointer-events:auto}

/* ---------- buttons ---------- */
.btn{--b:var(--accent);--b2:var(--accent-2);position:relative;border:0;border-radius:999px;padding:.55em 1.3em;font-weight:900;color:#fff;
  background:var(--b);box-shadow:0 .16em 0 var(--b2),0 .32em .7em rgba(16,32,64,.22);cursor:pointer;
  transition:transform .08s ease,box-shadow .08s ease;touch-action:manipulation;letter-spacing:.04em;line-height:1.1}
.btn:active,.btn.pressed{transform:translateY(.13em);box-shadow:0 .03em 0 var(--b2),0 .12em .3em rgba(16,32,64,.2)}
.btn:focus-visible,.iconbtn:focus-visible,.pickbtn:focus-visible,.list-card:focus-visible{outline:4px solid #ffcf33;outline-offset:4px}
.btn[disabled]{filter:saturate(.4) brightness(1.05);cursor:default}
.iconbtn{position:relative;width:clamp(48px,7vmin,64px);height:clamp(48px,7vmin,64px);border-radius:50%;border:0;display:grid;place-items:center;
  background:rgba(255,255,255,.88);box-shadow:0 3px 0 rgba(20,40,80,.18),0 6px 14px rgba(20,40,80,.14);cursor:pointer;flex:none}
.iconbtn svg{width:56%;height:56%}
.iconbtn .lp-ring{position:absolute;inset:-5px;border-radius:50%;pointer-events:none;opacity:0;
  background:conic-gradient(#ff8a00 var(--lpp,0%),transparent 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px))}
.lp-on .lp-ring{opacity:1;animation:lpfill var(--lp,1000ms) linear forwards}
@keyframes lpfill{from{--lpp:0%}to{--lpp:100%}}
@property --lpp{syntax:'<percentage>';inherits:false;initial-value:0%}
.lp-hint{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:4px;font-size:11px;white-space:nowrap;color:var(--ink-2);background:rgba(255,255,255,.85);border-radius:8px;padding:1px 6px;pointer-events:none}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;gap:clamp(6px,1.4vh,14px);
  padding:calc(var(--safe-t) + clamp(8px,1.6vh,16px)) calc(var(--safe-r) + clamp(12px,2.4vw,24px)) calc(var(--safe-b) + clamp(10px,1.8vh,18px) + var(--ground)) calc(var(--safe-l) + clamp(12px,2.4vw,24px))}
.topbar{display:flex;align-items:center;gap:clamp(8px,1.6vw,16px);min-height:var(--track-h);flex:none}
.track{position:relative;flex:1;height:var(--track-h);min-width:0}
.count{flex:none;min-width:clamp(70px,11vw,120px);text-align:center;font-weight:900;font-size:clamp(15px,2.6vmin,26px);line-height:1.1;
  background:rgba(255,255,255,.9);color:var(--ink);border-radius:18px;padding:.45em .7em;box-shadow:0 3px 0 rgba(20,40,80,.16)}
.count b{display:block;font-size:1.7em;font-family:var(--font-pop);font-weight:400;line-height:1}
.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:clamp(10px,2vw,24px);container-type:size}
.card-slot{position:relative;flex:1;align-self:stretch;min-width:0;display:grid;place-items:center;max-width:860px}
.card-slot>*{grid-area:1/1}
.actions{flex:none;display:flex;align-items:center;justify-content:center;gap:clamp(10px,2vw,24px);position:relative}
.actions .side{flex:1;display:flex;align-items:center}
.actions .side.r{justify-content:flex-end}

/* ---------- task card (base) ---------- */
.task-card{position:relative;width:min(100%,760px);max-height:100%;background:var(--card-bg);color:var(--card-ink);border-radius:30px;
  padding:clamp(12px,2.6vmin,28px) clamp(14px,3vmin,32px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,1.6vmin,14px);
  box-shadow:0 18px 40px rgba(16,36,72,.2),0 3px 0 rgba(16,36,72,.08);will-change:transform}
.card-head{display:flex;align-items:center;justify-content:center;gap:10px;font-size:clamp(14px,2.4vmin,24px);color:var(--ink-2);font-weight:900}
.task-icon{width:min(24vmin,230px);width:min(34cqh,26cqw,240px);aspect-ratio:1;display:grid;place-items:center;flex:none}
.task-icon svg,.task-icon img{width:100%;height:100%}
.task-icon img{object-fit:cover;border-radius:24px;border:5px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.22)}
.task-icon .emo{font-size:min(20vmin,190px);font-size:min(28cqh,22cqw,200px)}
.task-name{font-family:var(--font-task);font-weight:900;font-size:clamp(34px,8vmin,100px);font-size:clamp(30px,min(12cqh,9.5cqw),112px);
  line-height:1.12;letter-spacing:.05em;text-align:center;text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere}
body.big .task-name{font-size:clamp(40px,10vmin,120px);font-size:clamp(36px,min(15cqh,11.5cqw),130px)}
.task-num{font-family:var(--font-pop);font-weight:400}
.tc-main{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,1.6vmin,16px);min-width:0;max-width:100%}
.tc-text{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
@container (min-aspect-ratio:13/10){
  .task-card{width:min(100%,940px)}
  .tc-main{flex-direction:row;gap:clamp(12px,3cqw,40px)}
  .task-icon{width:min(48cqh,24cqw,250px)}
  .task-icon .emo{font-size:min(40cqh,20cqw,210px)}
  .tc-text{align-items:flex-start}
  .task-name{font-size:clamp(30px,min(19cqh,6.4cqw),116px);text-align:left}
  body.big .task-name{font-size:clamp(36px,min(23cqh,7.6cqw),136px)}
  .station-sign .tc-text{align-items:center}
  .station-sign .task-name{text-align:center}
}
.steps{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:100%}
.step{border:3px solid #d7e0ec;background:#f4f7fb;border-radius:999px;padding:.28em .85em .3em;font-size:clamp(16px,2.8vmin,28px);font-weight:900;cursor:pointer;color:#33415c;font-family:var(--font-task);transition:background .2s,border-color .2s}
.step .ck{display:inline-block;width:1.05em;height:1.05em;border-radius:50%;border:3px solid #b9c6d8;margin-right:.35em;vertical-align:-.12em;background:#fff}
.step.on{background:#e2f7e9;border-color:#4cc274}
.step.on .ck{background:#2fb35e;border-color:#2fb35e;box-shadow:inset 0 0 0 3px #fff}

/* ---------- done button ---------- */
.btn-done{--b:var(--done);--b2:var(--done-2);font-size:clamp(30px,6.4vmin,62px);padding:.36em 1.1em .4em;min-width:min(56vw,520px);display:inline-flex;align-items:center;justify-content:center;gap:.35em}
.btn-done .ic{width:1.1em;height:1.1em;display:grid;place-items:center;font-size:.95em}
.btn-done .ic svg{width:100%;height:100%}
.btn-done small{display:block;font-size:.36em;opacity:.92;letter-spacing:.08em;margin-top:.15em}
.btn-done .lbl{display:flex;flex-direction:column;align-items:center}
.btn-done.ready{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.btn-done:active{animation:none}
.undo{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--ink-2);font-weight:900}
.undo .iconbtn{width:clamp(44px,6vmin,56px);height:clamp(44px,6vmin,56px)}

/* ---------- start screen ---------- */
.start{align-items:center;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.start-top{display:flex;align-items:center;justify-content:space-between;width:100%;flex:none}
.who{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.9);border:0;border-radius:999px;padding:6px 16px 6px 6px;font-weight:900;font-size:clamp(16px,2.4vmin,22px);box-shadow:0 3px 0 rgba(20,40,80,.15);cursor:pointer}
.who .av{width:2em;height:2em;border-radius:50%;display:grid;place-items:center;background:#fff3c8;font-size:1.1em}
.start-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,1.8vh,18px);width:100%;max-width:1180px;min-height:min-content}
.pickwrap{display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;gap:clamp(8px,1.4vmin,14px);max-width:100%}
.title{font-family:var(--font-pop);font-weight:400;font-size:clamp(44px,9.4vmin,108px);line-height:1;letter-spacing:.06em;color:#fff;text-align:center;
  -webkit-text-stroke:0;text-shadow:0 4px 0 var(--title-sh,#1b5bb0),0 0 0 #000,3px 3px 0 var(--title-sh,#1b5bb0),-3px 3px 0 var(--title-sh,#1b5bb0),3px -2px 0 var(--title-sh,#1b5bb0),-3px -2px 0 var(--title-sh,#1b5bb0),0 10px 22px rgba(0,0,0,.25)}
.subtitle{font-size:clamp(17px,2.9vmin,30px);font-weight:900;background:rgba(255,255,255,.9);padding:.35em 1.1em;border-radius:999px;color:var(--ink);box-shadow:0 3px 0 rgba(20,40,80,.12);text-align:center}
.strip{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 4px;background:rgba(255,255,255,.82);border-radius:22px;padding:10px 14px;max-width:100%;box-shadow:0 3px 0 rgba(20,40,80,.12)}
.strip .it{display:flex;flex-direction:column;align-items:center;gap:2px;width:clamp(56px,9vmin,86px)}
.strip .ico{width:clamp(38px,6vmin,64px);height:clamp(38px,6vmin,64px);display:grid;place-items:center}
.strip .ico svg,.strip .ico img{width:100%;height:100%}
.strip .ico img{object-fit:cover;border-radius:10px}
.strip .ico .emo{font-size:clamp(32px,5.4vmin,54px)}
.strip .nm{font-size:clamp(11px,1.7vmin,16px);text-align:center;line-height:1.15;word-break:keep-all}
.strip .ar{color:#9aa9bf;font-size:clamp(14px,2.4vmin,22px)}
.btn-start{font-size:clamp(34px,7vmin,70px);padding:.32em 1.6em .38em;--b:#ff7a1a;--b2:#c95200}
.resume{display:flex;flex-direction:column;align-items:center;gap:10px}
.linkbtn{background:rgba(255,255,255,.88);border:0;border-radius:999px;padding:.45em 1.1em;font-weight:900;font-size:clamp(14px,2.2vmin,19px);cursor:pointer;box-shadow:0 2px 0 rgba(20,40,80,.14)}
.pickrow{position:relative;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:clamp(5px,.9vmin,10px);background:rgba(255,255,255,.74);border-radius:24px;padding:clamp(18px,2.6vmin,24px) 10px 8px;max-width:100%;min-width:0}
.pickrow .lab{position:absolute;top:3px;left:0;right:0;text-align:center;font-size:clamp(11px,1.6vmin,14px);color:var(--ink-2);line-height:1.2}
@media (min-aspect-ratio:5/4){.pickwrap{flex-wrap:nowrap}}
.pickbtn{border:0;background:#fff;color:var(--ink);border-radius:18px;padding:5px 5px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-width:clamp(54px,7.2vmin,84px);
  box-shadow:0 3px 0 #d0d9e6;font-weight:900;font-size:clamp(11px,1.7vmin,16px);transition:transform .12s;white-space:nowrap}
.pickbtn .emo{font-size:clamp(24px,4.2vmin,42px)}
.pickbtn .mi{width:clamp(24px,4.2vmin,42px);height:clamp(24px,4.2vmin,42px)}
.pickbtn.on{background:#fff6d1;box-shadow:0 0 0 4px #ffb400,0 3px 0 #d7a000;transform:translateY(-2px)}
.minor{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* ---------- profile picker ---------- */
.who-grid{display:flex;flex-wrap:wrap;gap:clamp(12px,2.4vmin,24px);justify-content:center;max-width:1000px}
.who-card{border:0;background:#fff;border-radius:28px;padding:16px 18px 14px;min-width:clamp(140px,20vmin,200px);display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;box-shadow:0 6px 0 #cfd9e8,0 12px 24px rgba(20,40,80,.14);font-weight:900;font-size:clamp(18px,3vmin,28px)}
.who-card .av{width:clamp(80px,13vmin,124px);height:clamp(80px,13vmin,124px);border-radius:50%;display:grid;place-items:center;background:#fff3c8;font-size:clamp(48px,8vmin,78px)}
.who-card:active{transform:translateY(4px);box-shadow:0 2px 0 #cfd9e8}

/* ---------- reveal overlay ---------- */
.reveal{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,1.4vh,14px);
  background:radial-gradient(closest-side,rgba(255,255,255,.92),rgba(255,255,255,.55) 60%,rgba(255,255,255,0));padding:20px}
.reveal.dark{background:radial-gradient(closest-side,rgba(20,24,60,.85),rgba(20,24,60,.45) 60%,rgba(20,24,60,0));color:#fff}
.reveal-item{width:min(46vmin,380px);height:min(40vmin,330px);display:grid;place-items:center}
.reveal-item>.emo{font-size:min(30vmin,260px)}
.reveal-item>svg{max-width:100%;max-height:100%;width:100%;height:100%}
.flagwave .sl>svg{max-width:none;max-height:none}
.reveal-title{font-family:var(--font-pop);font-weight:400;font-size:clamp(34px,7vmin,76px);line-height:1.1;text-align:center;letter-spacing:.04em}
.reveal-sub{font-size:clamp(18px,3.4vmin,34px);font-weight:900;text-align:center}
.reveal-fact{font-size:clamp(17px,3vmin,30px);font-weight:900;background:#fff;color:var(--ink);border-radius:999px;padding:.35em 1.1em;box-shadow:0 4px 0 rgba(0,0,0,.08);text-align:center;max-width:94vw}
.reveal .tapnext{position:absolute;bottom:calc(var(--safe-b) + 16px);font-size:14px;opacity:.6}
.float-item{position:fixed;left:0;top:0;pointer-events:none;display:grid;place-items:center;will-change:transform}
.float-item .emo{line-height:1}

/* ---------- praise ---------- */
.praise{align-items:center;justify-content:center;overflow-y:auto}
.praise-wrap{display:flex;align-items:center;justify-content:center;gap:clamp(16px,4vw,48px);flex-wrap:wrap;width:100%;max-width:1100px}
.praise-left{display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.4vh,14px);min-width:0}
.hanamaru{width:min(44vmin,360px);aspect-ratio:1;position:relative}
.hanamaru svg{width:100%;height:100%;overflow:visible}
.hanamaru .hm-name{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-pop);font-size:min(7vmin,58px);color:#e8383d;font-weight:400}
.praise-title{font-family:var(--font-pop);font-weight:400;font-size:clamp(44px,9.5vmin,104px);color:#fff;line-height:1.05;text-align:center;
  text-shadow:3px 3px 0 #e8383d,-3px 3px 0 #e8383d,3px -3px 0 #e8383d,-3px -3px 0 #e8383d,0 6px 0 #b8262b,0 12px 26px rgba(0,0,0,.25)}
.praise-sub{font-size:clamp(20px,3.8vmin,38px);font-weight:900;background:#fff;border-radius:999px;padding:.3em 1em;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.praise-meta{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.praise-meta span{background:rgba(255,255,255,.92);border-radius:14px;padding:.3em .8em;font-size:clamp(14px,2.4vmin,22px);font-variant-numeric:tabular-nums}
.collect{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;background:rgba(255,255,255,.85);border-radius:20px;padding:8px 12px;max-width:min(92vw,620px)}
.collect .ci{width:clamp(38px,6vmin,58px);height:clamp(38px,6vmin,58px);display:grid;place-items:center}
.collect .ci .emo{font-size:clamp(30px,5vmin,48px)}
.collect .ci svg{width:100%;height:100%}
.praise-right{display:flex;flex-direction:column;align-items:center;gap:12px}

/* ---------- stamp calendar ---------- */
.cal{background:#fffdf6;border-radius:24px;padding:12px 14px 14px;box-shadow:0 8px 0 #e9dfc6,0 14px 30px rgba(60,40,0,.15);width:min(92vw,440px);color:#3d3424}
.cal-h{display:flex;align-items:center;justify-content:space-between;font-family:var(--font-pop);font-weight:400;font-size:clamp(18px,3vmin,26px);margin-bottom:6px}
.cal-h button{border:0;background:#f3ead2;border-radius:12px;width:40px;height:36px;font-size:18px;cursor:pointer}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-g .wd{text-align:center;font-size:12px;color:#8a7d60}
.cal-g .wd.su{color:#e0503c}.cal-g .wd.sa{color:#3f7fd6}
.cal-g .d{aspect-ratio:1;border-radius:10px;background:#f7f0de;position:relative;display:grid;place-items:center;font-size:12px;color:#9b8d6c;font-variant-numeric:tabular-nums}
.cal-g .d .n{position:absolute;top:2px;left:5px;font-size:11px}
.cal-g .d.today{box-shadow:inset 0 0 0 3px #ffb400;background:#fff6d6}
.cal-g .d .stp{width:86%;height:86%;border-radius:50%;border:3px solid #e8383d;display:grid;place-items:center;transform:rotate(-14deg);color:#e8383d;background:rgba(255,255,255,.4)}
.cal-g .d .stp .emo{font-size:clamp(15px,2.6vmin,24px)}

/* ---------- stickers ---------- */
.book{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;width:100%;max-width:1000px;margin:0 auto}
.book-tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.book-grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(84px,13vmin,120px),1fr));gap:10px;padding:6px 4px 20px;align-content:start;-webkit-overflow-scrolling:touch}
.stk{background:#fff;border-radius:18px;aspect-ratio:1/1.18;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;box-shadow:0 3px 0 #d6deea;padding:6px}
.stk .pic{width:70%;aspect-ratio:1;display:grid;place-items:center}
.stk .pic .emo{font-size:clamp(34px,6.4vmin,60px)}
.stk .pic svg{width:100%;height:100%}
.stk .nm{font-size:clamp(10px,1.6vmin,14px);text-align:center;line-height:1.15}
.stk.no .pic{filter:brightness(0) opacity(.18)}
.stk.no .nm{color:#a0aabb}
.stk .cnt{position:absolute;top:4px;right:6px;font-size:12px;background:#ff7a1a;color:#fff;border-radius:999px;padding:0 6px}
.stk.r1{box-shadow:0 0 0 3px #7cc4ff,0 3px 0 #7cc4ff}
.stk.r2{box-shadow:0 0 0 3px #ffb400,0 3px 0 #ffb400;background:linear-gradient(135deg,#fff,#fff7d6 50%,#fff)}
.page-h{display:flex;align-items:center;gap:12px;flex:none}
.page-h h2{margin:0;font-family:var(--font-pop);font-weight:400;font-size:clamp(26px,5vmin,46px);color:#fff;text-shadow:2px 2px 0 var(--title-sh,#1b5bb0),-2px 2px 0 var(--title-sh,#1b5bb0),2px -2px 0 var(--title-sh,#1b5bb0),-2px -2px 0 var(--title-sh,#1b5bb0),0 4px 0 var(--title-sh,#1b5bb0)}
.page-h .grow{flex:1}

/* ---------- overlays: gacha / roulette ---------- */
.ovl{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2vh,18px);background:rgba(18,26,46,.55);padding:16px}
.ovl-title{font-family:var(--font-pop);font-weight:400;color:#fff;font-size:clamp(28px,6vmin,58px);text-shadow:0 4px 0 rgba(0,0,0,.3);text-align:center}
.gacha-box{width:min(52vmin,380px);aspect-ratio:200/300;position:relative;cursor:pointer;outline:none}
.gacha-box:focus-visible{outline:4px solid #ffcf33;outline-offset:6px;border-radius:20px}
.gacha-box svg{width:100%;height:100%}
.gacha-knob{transform-box:fill-box;transform-origin:center}
.tap-hint{font-size:clamp(16px,3vmin,26px);font-weight:900;color:#fff;background:rgba(0,0,0,.35);border-radius:999px;padding:.3em 1em;animation:breathe 1.6s ease-in-out infinite}
.capsule{position:fixed;left:0;top:0;width:min(20vmin,150px);aspect-ratio:1;pointer-events:none}
.sticker-big{display:flex;flex-direction:column;align-items:center;gap:8px}
.sticker-big .frame{width:min(42vmin,300px);aspect-ratio:1;border-radius:32px;background:#fff;display:grid;place-items:center;box-shadow:0 10px 0 rgba(0,0,0,.15)}
.sticker-big .frame .emo{font-size:min(28vmin,210px)}
.sticker-big .frame svg{width:78%;height:78%}
.sticker-big.r1 .frame{box-shadow:0 0 0 8px #7cc4ff,0 10px 0 rgba(0,0,0,.15)}
.sticker-big.r2 .frame{box-shadow:0 0 0 8px #ffb400,0 0 40px 10px rgba(255,200,40,.7),0 10px 0 rgba(0,0,0,.15)}
.rarity{font-family:var(--font-pop);font-weight:400;color:#fff;font-size:clamp(18px,3.4vmin,30px);text-shadow:0 3px 0 rgba(0,0,0,.3)}
.wheel-wrap{position:relative;width:min(70vmin,520px);aspect-ratio:1}
.wheel-wrap svg.wheel{width:100%;height:100%;transform-box:fill-box;transform-origin:center}
.wheel-pin{position:absolute;left:50%;top:-4%;width:9%;transform:translateX(-50%);z-index:2;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}

/* ---------- timer ---------- */
.timer{flex:none;width:min(26vmin,220px);width:min(40cqh,22cqw,240px);display:flex;flex-direction:column;align-items:center;gap:6px}
.timer svg{width:100%;aspect-ratio:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
.timer .tl{font-weight:900;font-size:clamp(16px,2.8vmin,28px);background:#fff;border-radius:999px;padding:.2em .8em;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 rgba(0,0,0,.1);white-space:nowrap}
.timer.over .tl{background:#fff1d6}
.stars{position:absolute;top:0;right:0;font-size:clamp(18px,3vmin,28px);background:rgba(255,255,255,.9);border-radius:14px;padding:.15em .6em}
@media (orientation:portrait){.stage.with-timer{flex-direction:column}.stage.with-timer .timer{width:min(22vh,30vw);flex-direction:row;width:auto;height:min(16vh,140px)}.stage.with-timer .timer svg{height:100%;width:auto}}

/* ---------- list mode ---------- */
.list-grid{flex:1 1 auto;min-height:0;max-height:calc(var(--rows,1) * 50vh);display:grid;gap:clamp(8px,1.6vmin,16px);grid-template-columns:repeat(var(--cols,3),1fr);grid-auto-rows:1fr;align-content:stretch;width:100%;max-width:1100px;margin:auto}
.list-card{position:relative;container-type:size;border:0;background:var(--card-bg);border-radius:24px;padding:clamp(8px,1.6vmin,16px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;
  box-shadow:0 6px 0 rgba(16,36,72,.14),0 10px 22px rgba(16,36,72,.14);min-height:0;transition:transform .15s;color:var(--card-ink)}
.list-card .lc-icon{width:min(16vmin,130px);width:min(56cqh,64cqw,240px);aspect-ratio:1;display:grid;place-items:center}
.list-card .lc-icon svg,.list-card .lc-icon img{width:100%;height:100%}
.list-card .lc-icon img{object-fit:cover;border-radius:16px}
.list-card .lc-icon .emo{font-size:min(12vmin,100px);font-size:min(44cqh,50cqw,190px)}
.list-card .lc-name{font-family:var(--font-task);font-weight:900;font-size:clamp(20px,4vmin,40px);font-size:clamp(18px,min(14cqh,11cqw),56px);text-align:center;line-height:1.1}
.list-card .lc-no{position:absolute;top:8px;left:10px;width:1.8em;height:1.8em;border-radius:50%;display:grid;place-items:center;background:#eef3fa;font-family:var(--font-pop);font-weight:400;font-size:clamp(13px,2vmin,18px)}
.list-card.done{transform:scale(.96)}
.list-card.done .lc-icon,.list-card.done .lc-name{opacity:.45}
.list-card .lc-stamp{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.list-card .lc-stamp>div{width:min(18vmin,150px);width:min(60cqh,60cqw,200px);aspect-ratio:1;border-radius:50%;border:6px solid #e8383d;color:#e8383d;display:grid;place-items:center;transform:rotate(-14deg);
  font-family:var(--font-pop);font-weight:400;font-size:min(4vmin,32px);background:rgba(255,255,255,.55)}
.list-hint{text-align:center;font-weight:900;font-size:clamp(16px,2.8vmin,26px);background:rgba(255,255,255,.9);border-radius:999px;padding:.3em 1em;align-self:center;box-shadow:0 3px 0 rgba(20,40,80,.12)}

/* ---------- toast / dialog ---------- */
#toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 24px);transform:translate(-50%,30px);background:rgba(20,28,45,.92);color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;opacity:0;transition:.25s;z-index:30;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.dialog-back{position:fixed;inset:0;background:rgba(10,16,28,.5);display:grid;place-items:center;padding:20px}
.dialog{background:var(--sheet-card);color:var(--sheet-ink);border-radius:20px;padding:20px;max-width:420px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.dialog-msg{margin:0 0 16px;font-size:17px;line-height:1.6;white-space:pre-line}
.dialog-row{display:flex;gap:10px;justify-content:flex-end}

/* ---------- settings sheet ---------- */
.sheet-back{position:fixed;inset:0;background:rgba(8,14,26,.45);display:flex;justify-content:center;align-items:flex-end}
.sheet{background:var(--sheet-bg);color:var(--sheet-ink);width:min(100%,920px);height:min(94%,980px);border-radius:24px 24px 0 0;display:flex;flex-direction:column;font-weight:500;
  -webkit-user-select:text;user-select:text;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet-h{display:flex;align-items:center;gap:12px;padding:14px 16px 10px;border-bottom:1px solid var(--sheet-line)}
.sheet-h h2{margin:0;font-size:19px;font-weight:900;flex:1}
.sheet-who{font-size:13px;color:var(--sheet-soft);font-weight:700}
.tabs{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;border-bottom:1px solid var(--sheet-line);flex:none}
.tab{border:0;background:var(--sheet-chip);color:var(--sheet-ink);border-radius:999px;padding:8px 14px;font-weight:900;font-size:14px;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--sheet-accent);color:#fff}
.sheet-body{flex:1;overflow-y:auto;padding:14px 16px calc(var(--safe-b) + 28px);-webkit-overflow-scrolling:touch}
.sec{background:var(--sheet-card);border:1px solid var(--sheet-line);border-radius:16px;padding:14px;margin-bottom:12px}
.sec h3{margin:0 0 4px;font-size:16px;font-weight:900}
.sec .note{margin:0 0 10px;font-size:13px;color:var(--sheet-soft);line-height:1.6;font-weight:500}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}
.row>label,.row>.lbl{min-width:7.5em;font-size:14px;font-weight:700}
.sbtn{border:1px solid var(--sheet-line);background:var(--sheet-field);color:var(--sheet-ink);border-radius:12px;padding:9px 14px;font-weight:900;font-size:14px;cursor:pointer;font-family:inherit}
.sbtn.primary{background:var(--sheet-accent);border-color:var(--sheet-accent);color:#fff}
.sbtn.danger{background:#e5483f;border-color:#e5483f;color:#fff}
.sbtn.sm{padding:6px 10px;font-size:13px}
.sbtn:disabled{opacity:.4}
.seg{display:inline-flex;background:var(--sheet-chip);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--sheet-ink);border-radius:9px;padding:7px 12px;font-weight:900;font-size:14px;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--sheet-card);box-shadow:0 1px 3px rgba(0,0,0,.18);color:var(--sheet-accent)}
.inp{border:1px solid var(--sheet-line);background:var(--sheet-field);color:var(--sheet-ink);border-radius:10px;padding:9px 11px;font-size:16px;font-family:var(--font-ui);font-weight:700;min-width:0}
.inp.num{width:4.6em;text-align:center;font-variant-numeric:tabular-nums}
input[type=range]{width:min(260px,60vw);accent-color:var(--sheet-accent)}
.trow{display:grid;grid-template-columns:auto 52px minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px;border:1px solid var(--sheet-line);border-radius:14px;margin-bottom:8px;background:var(--sheet-card)}
.trow .no{font-weight:900;color:var(--sheet-soft);width:1.6em;text-align:center}
.trow .ti{width:52px;height:52px;border-radius:12px;background:#fff;display:grid;place-items:center;border:1px solid var(--sheet-line);cursor:pointer;overflow:hidden}
.trow .ti svg,.trow .ti img{width:100%;height:100%}.trow .ti img{object-fit:cover}
.trow .ti .emo{font-size:36px}
.trow .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.trow .detail{grid-column:1/-1;border-top:1px dashed var(--sheet-line);padding-top:10px;margin-top:2px}
@media (max-width:560px){.trow{grid-template-columns:auto 48px minmax(0,1fr)}.trow .acts{grid-column:1/-1}}
.emogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;max-height:220px;overflow-y:auto;padding:2px}
.emogrid button{border:1px solid var(--sheet-line);background:#fff;border-radius:10px;height:46px;font-size:28px;cursor:pointer;display:grid;place-items:center;padding:4px}
.emogrid button svg{width:100%;height:100%}
.emogrid button.on{outline:3px solid var(--sheet-accent)}
.theme-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.theme-card{border:2px solid var(--sheet-line);border-radius:16px;padding:10px;display:flex;align-items:center;gap:10px;cursor:pointer;background:var(--sheet-field);font-weight:900;font-size:15px;color:var(--sheet-ink);font-family:inherit;text-align:left}
.theme-card .emo{font-size:30px}
.theme-card.on{border-color:var(--sheet-accent);box-shadow:0 0 0 2px var(--sheet-accent)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--sheet-line);cursor:pointer}
.swatch.on{box-shadow:0 0 0 3px var(--sheet-accent)}
.flaggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;max-height:300px;overflow-y:auto}
.flagopt{border:2px solid var(--sheet-line);background:var(--sheet-field);border-radius:10px;padding:5px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;cursor:pointer;color:var(--sheet-ink);font-family:inherit}
.flagopt svg{height:30px;width:auto;max-width:100%;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.flagopt.on{border-color:var(--sheet-accent);background:color-mix(in srgb,var(--sheet-accent) 12%,var(--sheet-field))}
.prow{display:grid;grid-template-columns:56px minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px;border:1px solid var(--sheet-line);border-radius:14px;margin-bottom:8px;background:var(--sheet-card)}
.prow .av{width:52px;height:52px;border-radius:50%;background:#fff3c8;display:grid;place-items:center;font-size:30px;border:0;cursor:pointer}
@media (max-width:560px){.prow{grid-template-columns:56px minmax(0,1fr)}.prow .acts{grid-column:1/-1}}
.prow.cur{border-color:var(--sheet-accent)}
.hist{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.hist th,.hist td{border-bottom:1px solid var(--sheet-line);padding:6px 6px;text-align:left;vertical-align:top}
.hist th{font-size:12px;color:var(--sheet-soft)}
.tablewrap{overflow-x:auto}
.csvbox{width:100%;height:140px;font-family:ui-monospace,Menlo,monospace;font-size:12px}

/* ================= THEMES ================= */
/* layers shared */
.bgfill{position:absolute;inset:0}
.par{position:absolute;left:0;background-repeat:repeat-x;background-position:left bottom;will-change:transform}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.9;filter:drop-shadow(0 6px 0 rgba(120,170,220,.25))}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:55%;height:180%;left:12%;bottom:20%}
.cloud::after{width:40%;height:140%;right:12%;bottom:25%}
.drift{animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}

/* --- train --- */
.th-train{--app-bg:#bfe5ff;--done:#18a058;--done-2:#0f7a41;--title-sh:#11653a}
.th-train .count{background:#14181d;color:#ffa21f;font-family:var(--font-dot);font-weight:400;box-shadow:0 0 0 3px #3a414b,0 4px 0 #0b0d10;border-radius:10px;text-shadow:0 0 6px rgba(255,150,30,.6)}
.th-train .count b{font-family:var(--font-dot)}
.g-train{position:absolute;left:0;right:0;bottom:0;height:var(--ground)}
.g-train .g-poles{bottom:24%;height:100%;width:calc(100% + 1600px)}
.g-train .g-track{bottom:0;height:26%;width:calc(100% + 1600px)}
.g-train .platform{position:absolute;left:0;right:0;bottom:0;height:9%;background:linear-gradient(#d9d4c8,#bfb8aa);border-top:3px solid #f0c419}
.train-sprite{position:absolute;bottom:17%;left:50%;height:min(66%,13vw);transform:translateX(-50%)}
.train-sprite svg{height:100%;width:auto;overflow:visible}
.train-sprite .wheel{transform-box:fill-box;transform-origin:center}
.train-sprite .door-l{transform-box:fill-box;transform-origin:left center;transition:transform .5s ease}
.train-sprite .door-r{transform-box:fill-box;transform-origin:right center;transition:transform .5s ease}
.train-sprite.open .door-l,.train-sprite.open .door-r{transform:scaleX(.08)}
.train-sprite .lamp{transition:fill .4s}
.train-sprite.lit .win{fill:#ffe9a8}
.tunnel{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 60%,rgba(30,22,10,.55),rgba(10,8,4,.92));opacity:0;pointer-events:none}
.station-sign{--line:#18a058;background:#fff;border-radius:18px;padding:0;overflow:hidden;gap:0;box-shadow:0 14px 0 #8b939d,0 18px 40px rgba(16,36,72,.22);border:4px solid #e7eaee}
.station-sign .ss-top{display:flex;align-items:flex-start;justify-content:space-between;width:100%;padding:clamp(8px,1.6vmin,14px) clamp(10px,2vmin,18px) 0}
.ss-num{display:grid;grid-template-rows:auto auto;border:4px solid var(--line);border-radius:10px;min-width:3.1em;text-align:center;font-family:var(--font-ui);font-weight:900;line-height:1;background:#fff;font-size:clamp(13px,2.2vmin,22px);overflow:hidden}
.ss-num .l{background:var(--line);color:#fff;font-size:.72em;padding:.18em 0 .16em}
.ss-num .n{font-size:1.3em;padding:.12em .1em .08em;color:#1f2d45}
.ss-body{display:flex;flex-direction:column;align-items:center;gap:clamp(2px,.8vmin,8px);padding:0 16px clamp(6px,1.2vmin,12px)}
.ss-romaji{font-family:"Helvetica Neue",Arial,var(--font-ui);font-weight:700;letter-spacing:.06em;color:#4b5567;font-size:clamp(14px,2.6vmin,28px)}
.ss-bar{width:100%;height:clamp(14px,2.4vmin,24px);background:var(--line);position:relative}
.ss-bar::after{content:"";position:absolute;left:50%;top:50%;width:clamp(18px,3vmin,30px);height:clamp(18px,3vmin,30px);transform:translate(-50%,-50%);border-radius:50%;background:#fff;border:5px solid var(--line)}
.ss-next{display:flex;justify-content:space-between;width:100%;padding:clamp(6px,1.2vmin,10px) clamp(10px,2vmin,18px) clamp(8px,1.6vmin,14px);font-size:clamp(14px,2.4vmin,24px);color:#37425a;gap:12px}
.ss-next span{display:flex;align-items:center;gap:.3em;min-width:0}
.ss-next .nx{justify-content:flex-end;text-align:right}
.ss-next .ar{color:var(--line);font-size:1.1em}
.ss-next .goal{color:#e5483f}
.route{position:absolute;inset:0}
.route .rl{position:absolute;top:44%;height:clamp(8px,1.4vh,12px);border-radius:8px;transform:translateY(-50%);background:var(--line,#18a058);opacity:.35}
.route .rl.done{opacity:1;transition:width .9s ease}
.route .st{position:absolute;top:44%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center}
.route .st i{width:clamp(18px,3vh,28px);height:clamp(18px,3vh,28px);border-radius:50%;background:#fff;border:clamp(4px,.7vh,6px) solid var(--line,#18a058);display:block;transition:background .4s}
.route .st.done i{background:var(--line,#18a058)}
.route .st.cur i{transform:scale(1.35);box-shadow:0 0 0 4px rgba(255,255,255,.8)}
.route .st span{position:absolute;top:calc(100% + 3px);white-space:nowrap;font-size:clamp(10px,1.6vh,15px);background:rgba(255,255,255,.88);padding:0 5px;border-radius:6px;color:#2a3550;max-width:16vw;overflow:hidden;text-overflow:ellipsis}
.route .mini{position:absolute;top:44%;width:clamp(42px,7vh,70px);transform:translate(-50%,-125%);transition:left 1.1s cubic-bezier(.6,0,.3,1)}
.route .mini svg{width:100%;height:auto}
.route .linebadge{position:absolute;left:0;top:-2px;font-size:clamp(10px,1.5vh,13px);background:var(--line,#18a058);color:#fff;border-radius:6px;padding:1px 6px}
.goal-banner{position:fixed;left:50%;top:18%;transform:translateX(-50%);font-family:var(--font-pop);font-weight:400;font-size:clamp(40px,10vmin,110px);color:#fff;background:#e5483f;padding:.1em .7em .15em;border-radius:24px;box-shadow:0 8px 0 #a92a23;letter-spacing:.1em;white-space:nowrap}

/* --- flags --- */
.th-flags{--app-bg:#bfe9ff;--done:#e8473d;--done-2:#ad2a22;--title-sh:#b8262b}
.airmail{background:#fff;border:12px solid transparent;border-radius:14px;

  const base = { あ: 'a', い: 'i', う: 'u', え: 'e', お: 'o', か: 'ka', き: 'ki', く: 'ku', け: 'ke', こ: 'ko', さ: 'sa', し: 'shi', す: 'su', せ: 'se', そ: 'so', た: 'ta', ち: 'chi', つ: 'tsu', て: 'te', と: 'to', な: 'na', に: 'ni', ぬ: 'nu', ね: 'ne', の: 'no', は: 'ha', ひ: 'hi', ふ: 'fu', へ: 'he', ほ: 'ho', ま: 'ma', み: 'mi', む: 'mu', め: 'me', も: 'mo', や: 'ya', ゆ: 'yu', よ: 'yo', ら: 'ra', り: 'ri', る: 'ru', れ: 're', ろ: 'ro', わ: 'wa', を: 'o', ん: 'n', が: 'ga', ぎ: 'gi', ぐ: 'gu', げ: 'ge', ご: 'go', ざ: 'za', じ: 'ji', ず: 'zu', ぜ: 'ze', ぞ: 'zo', だ: 'da', ぢ: 'ji', づ: 'zu', で: 'de', ど: 'do', ば: 'ba', び: 'bi', ぶ: 'bu', べ: 'be', ぼ: 'bo', ぱ: 'pa', ぴ: 'pi', ぷ: 'pu', ぺ: 'pe', ぽ: 'po', ゔ: 'vu', ぁ: 'a', ぃ: 'i', ぅ: 'u', ぇ: 'e', ぉ: 'o', ゃ: 'ya', ゅ: 'yu', ょ: 'yo' };
  const yo = { ゃ: 'a', ゅ: 'u', ょ: 'o' };
  const kataToHira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
  return function (input) {
    const s = kataToHira(input || '');
    if (/[^ぁ-ゖー\s・ー]/.test(s)) return '';
    const words = s.split(/[\s・]+/).filter(Boolean);
    const out = words.map(w => {
      let r = '';
      for (let i = 0; i < w.length; i++) {
        const ch = w[i], nx = w[i + 1];
        if (ch === 'ー') continue;
        if (ch === 'っ') { const nr = nx ? (base[nx] || '') : ''; r += nr.startsWith('ch') ? 't' : (nr[0] || ''); continue; }
        if (nx && yo[nx] && base[ch] && 'きしちにひみりぎじびぴぢ'.includes(ch)) {
          const b = base[ch]; let stem = b.slice(0, -1);
          if (['shi', 'chi', 'ji'].includes(b)) stem = b.slice(0, -1); else stem = b.slice(0, -1) + 'y';
          if (b === 'ji' || ch === 'ぢ') stem = 'j';
          r += stem + yo[nx]; i++; continue;
        }
        if (ch === 'ん') { const nr = nx ? (base[nx] || '') : ''; r += /^[bmp]/.test(nr) ? 'm' : 'n'; continue; }
        r += base[ch] || '';
      }
      r = r.replace(/ou/g, 'o').replace(/uu/g, 'u').replace(/oo(?!$)/g, 'o');
      return r.charAt(0).toUpperCase() + r.slice(1);
    });
    return out.join(' ');
  };
})();

const f3 = n => +n.toFixed(3);
function starD(cx, cy, r, rotDeg = -90, ratio = .382) {
  let d = '';
  for (let i = 0; i < 10; i++) {
    const a = (rotDeg + i * 36) * Math.PI / 180, rr = i % 2 ? r * ratio : r;
    d += (i ? 'L' : 'M') + f3(cx + rr * Math.cos(a)) + ' ' + f3(cy + rr * Math.sin(a));
  }
  return d + 'Z';
}
const hS = (W, H, cols, w) => { w = w || cols.map(() => 1); const t = w.reduce((a, b) => a + b, 0); let y = 0; return cols.map((c, i) => { const hh = H * w[i] / t; const s = `<rect x="0" y="${f3(y)}" width="${W}" height="${f3(hh + .02)}" fill="${c}"/>`; y += hh; return s; }).join(''); };
const vS = (W, H, cols, w) => { w = w || cols.map(() => 1); const t = w.reduce((a, b) => a + b, 0); let x = 0; return cols.map((c, i) => { const ww = W * w[i] / t; const s = `<rect x="${f3(x)}" y="0" width="${f3(ww + .02)}" height="${H}" fill="${c}"/>`; x += ww; return s; }).join(''); };
const nordic = (W, H, bg, x, wv, y, wh, col) => `<rect width="${W}" height="${H}" fill="${bg}"/><rect x="${x}" width="${wv}" height="${H}" fill="${col}"/><rect y="${y}" width="${W}" height="${wh}" fill="${col}"/>`;

function flagSVG(code, cls = '') {
  const f = FLAGS[code] || FLAGS.jp;
  return `<svg class="fl ${cls}" viewBox="0 0 ${f.w} ${f.h}" style="aspect-ratio:${f.w}/${f.h}" role="img" aria-label="${f.n}のこっき">${f.draw()}</svg>`;
}
function flagEl(code, cls) { return frag(flagSVG(code, cls)); }
function wavingFlag(code, heightPx) {
  const f = FLAGS[code] || FLAGS.jp, H = heightPx, W = H * f.w / f.h, n = 12, sw = W / n;
  const wrap = h('div', { class: 'flagwave', style: { width: W + 'px', height: H + 'px' } });
  for (let i = 0; i < n; i++) {
    const sl = h('div', { class: 'sl', style: { width: (sw + .6) + 'px', height: H + 'px', animationDelay: (-i * .13) + 's' } });
    const s = frag(flagSVG(code)); s.style.width = W + 'px'; s.style.left = (-i * sw) + 'px';
    sl.append(s, h('div', { class: 'sh', style: { animationDelay: (-i * .13) + 's' } }));
    wrap.append(sl);
  }
  return wrap;
}

function hanamaruD() {
  const cx = 100, cy = 100, pts = [];
  for (let t = 0; t <= 4 * Math.PI; t += .1) { const r = 6 + t * 3.55; pts.push([cx + r * Math.cos(t), cy + r * Math.sin(t)]); }
  const rr = 10.5, R = 6 * rr, d = 1.62 * rr;
  for (let t = 0; t <= Math.PI * 2 + .001; t += .025) {
    pts.push([cx + (R + rr) * Math.cos(t) - d * Math.cos((R + rr) / rr * t), cy + (R + rr) * Math.sin(t) - d * Math.sin((R + rr) / rr * t)]);
  }
  return 'M' + pts.map(p => f3(p[0]) + ' ' + f3(p[1])).join('L');
}

/* ---------- 記録 ---------- */
const MODE_JA = { normal: 'ふつう', list: 'いちらん', timer: 'タイマー', gacha: 'ガチャ', roulette: 'ルーレット' };
function hm(ts) { const d = new Date(ts); return `${d.getHours()}:${pad2(d.getMinutes())}`; }
function ms(sec) { if (sec == null) return '—'; return `${Math.floor(sec / 60)}:${pad2(sec % 60)}`; }
function historyCSV(hist) {
  const rows = [['日付', '開始', '終了', '所要(秒)', 'テーマ', 'モード', '★', '手順ごとの時間(秒)']];
  hist.forEach(e => rows.push([e.day, hm(e.start), hm(e.end), Math.round((e.end - e.start) / 1000), (THEMES[e.theme] || {}).name || e.theme, MODE_JA[e.mode] || e.mode, e.mode === 'timer' ? e.stars : '', e.tasks.map(t => `${t.name}:${t.sec == null ? '' : t.sec}`).join(' / ')]));
  return rows.map(r => r.map(c => { const s = String(c); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(',')).join('\n');
}
function tabLog(body) {

  const thisMonth = hist.filter(e => e.day.startsWith(month));
  const days = new Set(thisMonth.map(e => e.day)).size;
  const avg = thisMonth.length ? Math.round(thisMonth.reduce((a, e) => a + (e.end - e.start) / 1000, 0) / thisMonth.length) : 0;
  const table = h('table', { class: 'hist' }, h('thead', null, h('tr', null, ['日付', '開始', 'かかった時間', 'テーマ', 'モード', '手順ごと'].map(x => h('th', null, x)))),
    h('tbody', null, hist.slice(0, 60).map(e => h('tr', null, h('td', null, e.day.slice(5).replace('-', '/')), h('td', null, hm(e.start)), h('td', null, ms(Math.round((e.end - e.start) / 1000))), h('td', null, (THEMES[e.theme] || {}).name || ''), h('td', null, (MODE_JA[e.mode] || '') + (e.mode === 'timer' ? ` ★${e.stars}` : '')), h('td', null, e.tasks.map(t => `${t.name} ${ms(t.sec)}`).join('／'))))));
  const csvBox = h('textarea', { class: 'inp csvbox', readonly: true, id: 'csv', hidden: true });
  const copy = h('button', { class: 'sbtn primary', type: 'button', onclick: async () => { const csv = historyCSV(hist.slice().reverse()); csvBox.value = csv; try { await navigator.clipboard.writeText(csv); toast('CSVをコピーしました。表計算ソフトに貼り付けできます'); } catch (e) { csvBox.hidden = false; csvBox.focus(); csvBox.select(); toast('下の枠を選択してコピーしてください'); } } }, 'CSVをコピー');

  const dl = canDownload ? h('button', { class: 'sbtn', type: 'button', onclick: () => { const blob = new Blob(['﻿' + historyCSV(hist.slice().reverse())], { type: 'text/csv' }); const a = h('a', { href: URL.createObjectURL(blob), download: `あさのしたく_${P.name}_${dayKey()}.csv` }); document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); } }, 'CSVファイルを保存') : null;
  body.append(sec(`${P.name} さんの記録`, '「全部できた」ときに自動で記録します。記録とシールは、この端末のブラウザの中だけに保存されます（ほかの端末とは共有されません）。',
    h('div', { class: 'row' }, h('span', null, `今月：${days}日 達成`), h('span', null, `平均 ${ms(avg)}`), h('span', null, `合計 ${hist.length}回`)),
    hist.length ? h('div', { class: 'tablewrap' }, table) : h('p', { class: 'note' }, 'まだ記録がありません。'),
    h('div', { class: 'row' }, copy, dl), csvBox));
  body.append(sec('リセット', null, h('div', { class: 'row' },
    h('button', { class: 'sbtn', type: 'button', onclick: async () => { if (await confirmBox(`${P.name} さんの記録（スタンプカード）を消しますか？`, { ok: '消す', danger: true })) { D.history[P.id] = []; changed(); } } }, '記録を消す'),
    h('button', { class: 'sbtn', type: 'button', onclick: async () => { if (await confirmBox(`${P.name} さんのシール帳を空にしますか？`, { ok: '空にする', danger: true })) { D.stickers[P.id] = {}; changed(); } } }, 'シールを空にする'),
